name: 'Configure AWS session credentials'
description: 'Wrapper de aws-actions/configure-aws-credentials para os 4 secrets padrão de credenciais de sessão (AWS Academy Lab, sem OIDC)'
inputs:
  aws-access-key-id:
    required: true
  aws-secret-access-key:
    required: true
  aws-session-token:
    required: true
  aws-region:
    required: true
runs:
  using: 'composite'
  steps:
    - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
      with:
        aws-access-key-id: ${{ inputs.aws-access-key-id }}
        aws-secret-access-key: ${{ inputs.aws-secret-access-key }}
        aws-session-token: ${{ inputs.aws-session-token }}
        aws-region: ${{ inputs.aws-region }}
