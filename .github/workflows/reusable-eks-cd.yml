name: Reusable — EKS/Kustomize CD

on:
  workflow_call:
    inputs:
      ecr-repository:
        type: string
        required: true
      dockerfile:
        type: string
        required: false
        default: 'Dockerfile'
      docker-target:
        type: string
        required: false
        default: ''
      kustomize-overlay:
        type: string
        required: true
      deployments:
        type: string
        required: true
      eks-cluster-name:
        type: string
        required: false
        default: 'video-processor-eks-prod'
      sqs-queue-env:
        description: 'Formato "deployment:ENV_VAR_NAME:sqs-queue-name" — resolve a URL da fila via AWS CLI e injeta no Deployment com kubectl set env (o kustomize/manifest não sabe a URL, que muda por conta/região). Vazio = não faz nada.'
        type: string
        required: false
        default: ''
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      AWS_SESSION_TOKEN:
        required: true
      AWS_REGION:
        required: true

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment: aws-prod
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: 13SOAT-andromeda/tech-andromeda-ci-config/actions/configure-aws-session@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2
        id: ecr
      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region ${{ secrets.AWS_REGION }} --name ${{ inputs.eks-cluster-name }}
      - name: Point overlay at ECR image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ inputs.ecr-repository }}
        run: |
          sed -i "s|newName: .*|newName: ${ECR_REGISTRY}/${ECR_REPOSITORY}|" ${{ inputs.kustomize-overlay }}/kustomization.yaml
      - name: kubectl diff (dry-run)
        run: kubectl diff -k ${{ inputs.kustomize-overlay }} | tee diff.txt || true
      - name: Comment diff on PR
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const fs = require('fs');
            const diff = fs.readFileSync('diff.txt', 'utf8').slice(-60000) || '(sem diferenças)';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `#### kubectl diff — \`${{ inputs.kustomize-overlay }}\`\n\`\`\`\n${diff}\n\`\`\``
            });

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: aws-prod
    steps:
      - uses: actions/checkout@v4
      - uses: 13SOAT-andromeda/tech-andromeda-ci-config/actions/configure-aws-session@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2
        id: ecr
      - name: Build & push image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ inputs.ecr-repository }}
        run: |
          docker build \
            -f ${{ inputs.dockerfile }} \
            ${{ inputs.docker-target != '' && format('--target {0}', inputs.docker-target) || '' }} \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region ${{ secrets.AWS_REGION }} --name ${{ inputs.eks-cluster-name }}
      - name: Point overlay at ECR image and apply
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ inputs.ecr-repository }}
        run: |
          sed -i "s|newName: .*|newName: ${ECR_REGISTRY}/${ECR_REPOSITORY}|" ${{ inputs.kustomize-overlay }}/kustomization.yaml
          kubectl apply -k ${{ inputs.kustomize-overlay }}
      - name: Wait for rollout
        run: |
          for d in ${{ inputs.deployments }}; do
            kubectl rollout status deployment/$d -n default --timeout=180s
          done
      - name: Resolve SQS queue URL env var
        if: inputs.sqs-queue-env != ''
        env:
          SQS_QUEUE_ENV: ${{ inputs.sqs-queue-env }}
        run: |
          IFS=':' read -r DEPLOY VAR QUEUE <<< "$SQS_QUEUE_ENV"
          URL=$(aws sqs get-queue-url --queue-name "$QUEUE" --query QueueUrl --output text)
          kubectl set env "deployment/$DEPLOY" -n default "$VAR=$URL"
          kubectl rollout status "deployment/$DEPLOY" -n default --timeout=180s
