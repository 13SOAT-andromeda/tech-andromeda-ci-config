name: Reusable — Terraform CD

on:
  workflow_call:
    inputs:
      terraform-dir:
        type: string
        required: true
      run-tests:
        type: boolean
        required: false
        default: true
      extra-tf-vars:
        type: string
        required: false
        default: ''
      datadog-api-key-var-name:
        description: 'Nome da variável Terraform que deve receber o secret DD_API_KEY (ex.: "datadog_api_key" em iac-infra, "dd_api_key" em converter). Vazio = não passa nenhuma var de Datadog.'
        type: string
        required: false
        default: ''
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      AWS_SESSION_TOKEN:
        required: true
      AWS_REGION:
        required: true
      AWS_S3_TF_STATE_BUCKET_NAME:
        required: true
      DD_API_KEY:
        required: false

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment: aws-prod
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: ${{ inputs.terraform-dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
      - uses: 13SOAT-andromeda/tech-andromeda-ci-config/actions/configure-aws-session@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: terraform fmt -check
        run: terraform fmt -check -recursive
      - name: terraform init
        run: terraform init -input=false -reconfigure -backend-config="bucket=${{ secrets.AWS_S3_TF_STATE_BUCKET_NAME }}"
      - name: terraform validate
        run: terraform validate
      - name: terraform test
        if: inputs.run-tests
        run: terraform test
      - name: Security scan (tfsec)
        uses: aquasecurity/tfsec-action@b466648d6e39e7c75324f25d83891162a721f2d6 # v1.0.3
        with:
          working_directory: ${{ inputs.terraform-dir }}
          soft_fail: true
      - name: terraform plan
        env:
          DD_VAR_NAME: ${{ inputs.datadog-api-key-var-name }}
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
        run: |
          TF_VARS=(${{ inputs.extra-tf-vars }})
          if [ -n "$DD_VAR_NAME" ]; then
            TF_VARS+=("-var=${DD_VAR_NAME}=${DD_API_KEY}")
          fi
          terraform plan -input=false -no-color "${TF_VARS[@]}" -out=tfplan | tee plan.txt
      - name: Comment plan on PR
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('${{ inputs.terraform-dir }}/plan.txt', 'utf8').slice(-60000);
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `#### Terraform Plan — \`${{ inputs.terraform-dir }}\`\n\`\`\`\n${plan}\n\`\`\``
            });

  apply:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: aws-prod
    defaults:
      run:
        working-directory: ${{ inputs.terraform-dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
      - uses: 13SOAT-andromeda/tech-andromeda-ci-config/actions/configure-aws-session@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: terraform init
        run: terraform init -input=false -reconfigure -backend-config="bucket=${{ secrets.AWS_S3_TF_STATE_BUCKET_NAME }}"
      - name: terraform apply
        env:
          DD_VAR_NAME: ${{ inputs.datadog-api-key-var-name }}
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
        run: |
          TF_VARS=(${{ inputs.extra-tf-vars }})
          if [ -n "$DD_VAR_NAME" ]; then
            TF_VARS+=("-var=${DD_VAR_NAME}=${DD_API_KEY}")
          fi
          terraform apply -input=false -auto-approve "${TF_VARS[@]}"
